# Vérifie puis publie l'application (Flutter web) et le tableau de bord sur GitHub Pages.
name: Vérification et publication

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      goldens:
        description: Régénérer les captures de référence (golden tests) et les fournir en artefact
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Version fixe : captures de référence stables, et Playwright ne gère pas encore Ubuntu 26.04.
    runs-on: ubuntu-24.04
    env:
      BASE: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      # Tableau de bord (React + Vite)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Critères d'acceptation vérifiables sans exécution (couleurs, réseau, textes, routes…)
        run: node tools/verifier.mjs >> "$GITHUB_STEP_SUMMARY" && node tools/verifier.mjs
      - name: Tableau de bord — lint et build
        working-directory: dashboard
        run: |
          npm ci
          npm run lint
          npm test
          npm run build -- --base=$BASE/dashboard/
      - name: Tableau de bord — navigateur de test
        working-directory: dashboard
        run: npx playwright install --with-deps chromium
      - name: Tableau de bord — tests Playwright (D1 à D8, comparaison à la maquette)
        if: ${{ !inputs.goldens }}
        working-directory: dashboard
        run: npx playwright test
      - name: Tableau de bord — régénération des captures
        if: ${{ inputs.goldens }}
        working-directory: dashboard
        run: npx playwright test --grep @regression --update-snapshots
      - name: Tableau de bord — captures et rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-captures
          path: |
            dashboard/tests/captures/
            dashboard/test-results/
            dashboard/playwright-report/
          if-no-files-found: ignore

      # Application citoyenne (Flutter)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Mobile — dépendances
        working-directory: mobile
        run: flutter pub get
      - name: Mobile — analyse
        working-directory: mobile
        run: flutter analyze
      - name: Mobile — tests
        # Lancés même si l'analyse échoue, pour voir tous les problèmes en une fois.
        if: success() || failure()
        working-directory: mobile
        run: flutter test --exclude-tags golden
      - name: Mobile — golden tests (captures M1 à M4)
        if: (success() || failure()) && !inputs.goldens
        working-directory: mobile
        run: |
          if ls test/goldens/*.png >/dev/null 2>&1; then
            flutter test --tags golden
          else
            echo "Pas encore de captures de référence : lancer le workflow à la main avec « goldens »."
          fi
      - name: Mobile — régénération des captures
        if: inputs.goldens
        working-directory: mobile
        run: flutter test --tags golden --update-goldens
      - name: Mobile — captures et différences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: |
            mobile/test/goldens/
            mobile/test/failures/
          if-no-files-found: ignore
      - name: Comparaison des captures aux maquettes (écart de position ≤ 4 px)
        # Sur les captures enregistrées dans le dépôt ; sautée pendant leur régénération.
        if: ${{ (success() || failure()) && !inputs.goldens }}
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/comparer_maquettes.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Mobile — build web
        working-directory: mobile
        # CanvasKit servi avec l'application (sinon chargé depuis www.gstatic.com).
        # Mode réel : API Hydrotic (connexion Clerk chargée par web/index.html).
        run: flutter build web --release --no-web-resources-cdn --base-href $BASE/app/ --dart-define=API_URL=https://hydrotic-ci-api.vercel.app

      - name: Assemblage du site
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp -R mobile/build/web _site/app
          cp -R dashboard/dist _site/dashboard
      - name: Site — aucun appel réseau externe (application et tableau de bord compilés)
        run: |
          mkdir -p /tmp/srv && ln -s "$PWD/_site" /tmp/srv${BASE}
          (cd /tmp/srv && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          node tools/verifier_web.mjs http://127.0.0.1:8080${BASE}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # API (FastAPI) : tests sur une base PostGIS jetable, jamais sur Neon.
  api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hydrotic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: API — dépendances
        run: uv sync --frozen
      - name: API — tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/hydrotic_test
        run: uv run pytest -q

  deploy:
    # Publication seulement pour un dépôt public (GitHub Pages gratuit). Dépôt privé : vérification seule,
    # le site reste téléchargeable dans l'artefact « github-pages » du run.
    if: github.event_name != 'pull_request' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
