# Vérifie puis publie l'application (Flutter web) et le tableau de bord sur GitHub Pages.
name: Vérification et publication

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      # Tableau de bord (React + Vite)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Tokens — fichiers générés à jour
        run: node tools/gen_tokens.mjs --check
      - name: Tableau de bord — lint et build
        working-directory: dashboard
        run: |
          npm ci
          npm run lint
          npm run build -- --base=$BASE/dashboard/

      # Application citoyenne (Flutter)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Mobile — analyse, tests et build web
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release --base-href $BASE/app/

      - name: Assemblage du site
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp -R mobile/build/web _site/app
          cp -R dashboard/dist _site/dashboard
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
