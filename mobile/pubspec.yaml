name: hydrotic_ci
description: "Hydrotic CI — application citoyenne de prévention des inondations (phase 1 : interface)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  # Phase 2 : API Hydrotic, carte OpenStreetMap, position GPS.
  http: ^1.2.2
  flutter_map: ">=7.0.2 <9.0.0"
  latlong2: ^0.9.1
  geolocator: ">=13.0.0 <15.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fixtures/
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    # Police par défaut du moteur web : déclarée localement (Inter), sinon téléchargée
    # depuis fonts.gstatic.com au démarrage (aucun appel réseau en phase 1).
    - family: Roboto
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
