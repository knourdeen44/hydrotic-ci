<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hydrotic CI — prévoir, alerter et secourir face aux inondations.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hydrotic CI">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Hydrotic CI</title>
</head>
<body>
  <script>
    // Pont Clerk pour l'application (mode réel). Mode démo (menu du tableau de bord ou lien de
    // scénario « ?demo= ») : Clerk n'est pas chargé, aucun appel réseau.
    (function () {
      var CLE = 'pk_test_Y2xvc2Utc2VhbC03MzQyLmNsZXJrLmFjY291bnRzLmRldiQ';
      var demo = /[?&]demo=/.test(location.hash);
      try { demo = demo || localStorage.getItem('hydrotic-mode') === 'demo'; } catch (e) {}
      var clerk = demo ? Promise.resolve(null) : new Promise(function (ok) {
        var s = document.createElement('script');
        s.src = 'https://' + atob(CLE.split('_')[2]).replace(/\$$/, '') + '/npm/@clerk/clerk-js@5/dist/clerk.browser.js';
        s.async = true;
        s.crossOrigin = 'anonymous';
        s.setAttribute('data-clerk-publishable-key', CLE);
        s.onload = function () { window.Clerk.load().then(function () { ok(window.Clerk); }, function () { ok(null); }); };
        s.onerror = function () { ok(null); };
        document.head.appendChild(s);
      });
      window.hydroticClerk = {
        demo: demo,
        connecte: function () { return clerk.then(function (c) { return !!(c && c.user); }); },
        jeton: function () { return clerk.then(function (c) { return c && c.session ? c.session.getToken() : null; }); },
        connecter: function (inscription) {
          return clerk.then(function (c) {
            if (!c) return false;
            if (c.user) return true;
            return new Promise(function (ok) {
              var arreter = c.addListener(function (e) {
                if (e.user) { arreter(); c.closeSignIn(); c.closeSignUp(); ok(true); }
              });
              if (inscription) c.openSignUp({}); else c.openSignIn({});
            });
          });
        },
        deconnecter: function () { return clerk.then(function (c) { return c ? c.signOut() : null; }); },
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
