[project]
name = "hydrotic-api"
version = "0.2.0"
description = "API Hydrotic CI (phase 2) : zones, prévisions, alertes, signalements, SOS."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "psycopg[binary]>=3.2",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "uvicorn>=0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
